PACKAGE_NAME="morse"
PACKAGE_VERSION="mm6108-2.0.1"
# Two non-mainline build requirements — see BRINGUP.md §2:
#   KCFLAGS=-Wno-error=cpp        spi.c #warnings on SPI_CONTROLLER_ENABLE_CS_GPIOD,
#                                 a macro supplied by Morse's own kernel patch, and
#                                 the Makefile's -Werror makes that fatal on a stock
#                                 kernel.
#   CONFIG_MORSE_VENDOR_COMMAND=y defaults to n in Kconfig, but vendor_ie.o is in the
#                                 unconditional object list and references vendor.o's
#                                 symbols, so a default build dies at modpost.
# MORSE_TRACE_PATH is omitted: the Makefile defaults it to '.' which is correct here.
# Region is set at runtime via country= in /etc/modprobe.d/morse.conf, not at build time.
MAKE[0]="make KCFLAGS=-Wno-error=cpp KERNEL_SRC=/lib/modules/${kernelver}/build CONFIG_WLAN_VENDOR_MORSE=m CONFIG_MORSE_SPI=y CONFIG_MORSE_SDIO=y CONFIG_MORSE_USER_ACCESS=y CONFIG_MORSE_VENDOR_COMMAND=y CONFIG_MORSE_DEBUGFS=y CONFIG_MORSE_MONITOR=y"
CLEAN="make clean KERNEL_SRC=/lib/modules/${kernelver}/build || true"
BUILT_MODULE_NAME[0]="morse"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="dot11ah"
BUILT_MODULE_LOCATION[1]="dot11ah"
DEST_MODULE_LOCATION[1]="/updates"
# The whole point: rebuild automatically when the kernel changes. Without this an
# unattended kernel upgrade silently disarms the radio (BRINGUP.md §5).
AUTOINSTALL="yes"
